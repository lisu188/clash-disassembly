name: Mission05 Apply Recovery Clean

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/mission05-failure-recovery-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mission05-failure-recovery-clean
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libsdl2-dev libx11-dev
      - name: Apply recovery patch
        run: |
          sed -i 's/"UI_CheckDialogAccepted", "Mission_CheckFailureCondition", 1, "rename index dispatcher"/"UI_CheckDialogAccepted", "Mission_CheckFailureCondition", 3, "rename index dispatcher"/' tools/apply_mission05_failure_recovery.py
          set +e
          python3 tools/apply_mission05_failure_recovery.py >mission05-patch.log 2>&1
          echo $? >mission05-patch.rc
          set -e
          cat mission05-patch.log
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission05-patch-diagnostics
          path: |
            mission05-patch.log
            mission05-patch.rc
          if-no-files-found: error
      - name: Require patch success
        run: test "$(cat mission05-patch.rc)" = 0
      - name: Validate metadata and documentation
        run: |
          python3 -m json.tool RECOVERED_STRUCTURES.json >/dev/null
          python3 -m json.tool UNIT_TYPES_AND_STATS.json >/dev/null
          python3 tests/check_markdown_links.py
          git diff --check
      - name: Build recovered executable and tests
        run: |
          set +e
          {
            cmake -S . -B build-mission05 -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCLASH95_COVERAGE=ON
            cmake --build build-mission05 --target clash95_bootstrap clash95_unit_tests runtime_mission_trace_tests -j2
          } >mission05-build.log 2>&1
          echo $? >mission05-build.rc
          set -e
          cat mission05-build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission05-build-diagnostics
          path: |
            mission05-build.log
            mission05-build.rc
          if-no-files-found: error
      - name: Require build success
        run: test "$(cat mission05-build.rc)" = 0
      - name: Run tests
        run: |
          ctest --test-dir build-mission05 -R '^runtime_mission_trace_tests$' --output-on-failure
          build-mission05/bin/clash95_unit_tests
      - name: Commit recovered changes
        run: |
          rm -f mission05-patch.log mission05-patch.rc mission05-build.log mission05-build.rc
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Recover mission 05 failure predicate semantics'
          git push origin HEAD:codex/mission05-failure-recovery-clean
