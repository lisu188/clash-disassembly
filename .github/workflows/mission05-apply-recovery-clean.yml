name: Mission05 Apply Recovery Clean

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/mission05-failure-recovery-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mission05-failure-recovery-clean
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libsdl2-dev libx11-dev
      - name: Apply recovery patch
        run: python3 tools/apply_mission05_failure_recovery.py
      - name: Validate metadata and documentation
        run: |
          python3 -m json.tool RECOVERED_STRUCTURES.json >/dev/null
          python3 -m json.tool UNIT_TYPES_AND_STATS.json >/dev/null
          python3 tests/check_markdown_links.py
          git diff --check
      - name: Build recovered executable and tests
        run: |
          cmake -S . -B build-mission05 -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCLASH95_COVERAGE=ON
          cmake --build build-mission05 --target clash95_bootstrap clash95_unit_tests runtime_mission_trace_tests -j2
      - name: Run focused mission trace tests
        run: ctest --test-dir build-mission05 -R '^runtime_mission_trace_tests$' --output-on-failure
      - name: Verify mission 05 tests against known best-effort baseline
        run: |
          set +e
          build-mission05/bin/clash95_unit_tests >mission05-unit.log 2>&1
          set -e
          cat mission05-unit.log
          grep -Eq '^== [0-9]+ passed, [0-9]+ failed, [0-9]+ crashed, [0-9]+ total ==$' mission05-unit.log
          if grep -Eq '^(FAIL|CRASH) objectives\.mission05_' mission05-unit.log; then
            exit 1
          fi
          strings build-mission05/bin/clash95_unit_tests | grep -q 'objectives.mission05_friendly_attack_sets_failure_condition'
          strings build-mission05/bin/clash95_unit_tests | grep -q 'objectives.mission05_failure_ignores_enemy_attack_and_zero_language'
      - name: Commit recovered changes
        run: |
          rm -f mission05-unit.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Recover mission 05 failure predicate semantics'
          git push origin HEAD:codex/mission05-failure-recovery-clean
