name: Apply UnitStack readability migration

on:
  push:
    branches:
      - readability/unit-stack-record

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out readability branch
        uses: actions/checkout@v4
        with:
          ref: readability/unit-stack-record
          fetch-depth: 0

      - name: Apply typed UnitStack migration
        run: python3 tools/migrate_unit_stack_readability.py

      - name: Validate split-source contract and whitespace
        run: |
          python3 tools/audit_split_sources.py
          git diff --check

      - name: Remove one-shot workflow
        run: rm .github/workflows/readability-unit-stack-migration.yml

      - name: Commit migrated C
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/units/00414390_00416750_units_004.c .github/workflows/readability-unit-stack-migration.yml
          git commit -m "Migrate movement paths to typed UnitStack access"
          git push origin HEAD:readability/unit-stack-record
