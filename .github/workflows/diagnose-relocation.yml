name: Apply relocation audit fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix relocated audit inventory
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path.cwd()
          audit = root / "tools" / "audit_split_sources.py"
          text = audit.read_text(encoding="utf-8")
          start = text.index("    generated = sorted(")
          end = text.index("    audit.require(bool(generated)", start)
          replacement = '''    generated = sorted(
              {
                  ROOT / value["source"]
                  for value in records
                  if isinstance(value, dict) and isinstance(value.get("source"), str)
              }
              | ({state_owner} if state_owner is not None else set())
          )
'''
          audit.write_text(
              text[:start] + replacement + text[end:],
              encoding="utf-8",
              newline="\n",
          )

          for relative in (
              "src/recovered/runtime/00461520_platform_input.inc.c",
              "src/recovered/runtime/004D0560_legacy_runtime.inc.c",
          ):
              (root / relative).unlink(missing_ok=True)

          (root / ".github" / "workflows" / "diagnose-relocation.yml").unlink()
          PY

          python3 tools/audit_split_sources.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix relocated source audit inventory"
          git push origin HEAD:${TARGET_BRANCH}
