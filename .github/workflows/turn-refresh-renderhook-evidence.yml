name: Turn refresh render-hook evidence

on:
  push:
    branches:
      - diagnostics/turn-refresh-renderhook-evidence

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f4c7a1dd0432870e57b866d5981446d0c1962a7f
          persist-credentials: false
      - name: Extract original render-hook and selection-sync procedures
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path
          text=Path('clash95.asm').read_text(encoding='latin-1')
          raw=Path('clash95.asm').read_bytes()
          print('ASSEMBLY_SHA256',hashlib.sha256(raw).hexdigest())
          def proc(name):
              m=re.search(rf'(?ms)^\s*{re.escape(name)}\s+proc\b.*?^\s*{re.escape(name)}\s+endp\b',text)
              if not m: raise SystemExit(name+' not found')
              body=m.group(0)
              print('===',name,'===')
              print(body)
              norm=[]
              for line in body.splitlines()[1:-1]:
                  code=line.split(';',1)[0].strip()
                  if code and not code.endswith(':'):
                      norm.append(re.sub(r'\s+',' ',code))
              print('NORM_SHA256',name,hashlib.sha256('\n'.join(norm).encode()).hexdigest())
          for name in ('sub_40AD40','Render_LoadResourceSprite','sub_406980'):
              proc(name)
          print('=== CALLERS sub_40AD40 ===')
          lines=text.splitlines()
          for m in re.finditer(r'(?m)^\s*call\s+sub_40AD40\b',text):
              idx=len(text[:m.start()].splitlines())
              print('\n'.join(lines[max(0,idx-10):min(len(lines),idx+11)]))
          PY
