name: Construct array-open recovery preparation

on:
  push:
    branches:
      - diagnostics/construct-array-open-evidence

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: preparation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          ref: f12a97c000f60cd766d81bd3126a16085698205a
          persist-credentials: false
      - name: Install supported fixture compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-13 clang-18
      - name: Apply exact source-only recovery patch
        working-directory: source
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, subprocess
          from pathlib import Path
          compressed = b''.join(Path(f'../preparation/.diagnostics/construct-open.xz.{i}').read_bytes() for i in range(3))
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '0d837a91cbe7fa2774e116cc3a1b378a19b32adf70d5c5721e904738ba2bf0a7'
          assembly = hashlib.sha256(Path('clash95.asm').read_bytes()).hexdigest()
          before = json.loads(Path('data/recovered_sources.json').read_text())
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply'], input=patch, check=True)
          after = json.loads(Path('data/recovered_sources.json').read_text())
          changed = []
          assert len(before['functions']) == len(after['functions']) == 4157
          for old, new in zip(before['functions'], after['functions'], strict=True):
              if old != new:
                  assert {k: v for k, v in old.items() if k != 'body_sha256'} == {k: v for k, v in new.items() if k != 'body_sha256'}
                  changed.append(old['name'])
          assert len(changed) == 22 and 'Rules_ConstructCodeFileOpen' in changed
          assert hashlib.sha256(Path('clash95.asm').read_bytes()).hexdigest() == assembly
          print('Applied exact patch; changed current hashes:', changed)
          print('Protected assembly SHA256:', assembly)
          PY
      - name: Execute original instructions and production profiles
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests/tools -p test_construct_code_file_open.py -v 2>&1 | tee construct-open-focused.log
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'tests/tools')
          import test_construct_code_file_open as t
          print('RETURNING_CASES', len(t.CASES), 'TERMINATING_CASES', len(t.FATAL_CASES))
          print('TRACE_BYTES', len(t.EXPECTED), 'SHA256', t.EXPECTED_SHA256)
          PY
      - name: Audit source, headers and documentation
        working-directory: source
        run: |
          python3 tools/audit_split_sources.py
          python3 tools/gen_subsystem_headers.py --check
          python3 tools/gen_subsystem_headers.py --check-tu-includes
          python3 tests/check_markdown_links.py
          git diff --check
      - name: Publish verified Git objects without changing branches
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == 'f12a97c000f60cd766d81bd3126a16085698205a'
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          paths.append('tests/tools/test_construct_code_file_open.py')
          paths = sorted(set(paths))
          assert len(paths) == 22
          assert all(Path(p).suffix in {'.cpp', '.h', '.json', '.md', '.py'} and not p.startswith('.') for p in paths)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          assert subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines() == paths
          def post(endpoint, payload):
              return json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/lisu188/clash-disassembly/git/' + endpoint, '--input', '-'], input=json.dumps(payload).encode()))
          entries = []
          for name in paths:
              content = Path(name).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              blob = post('blobs', {'encoding': 'base64', 'content': base64.b64encode(content).decode()})
              assert blob['sha'] == expected, name
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': expected})
          tree = post('trees', {'base_tree': '208e6c058ae2ed086fc1dffdfa9897dbde9ddbf6', 'tree': entries})
          result = {'tree_sha': tree['sha'], 'files': entries}
          Path('../publication.json').write_text(json.dumps(result, indent=2) + '\n')
          print('PUBLISHED_TREE', json.dumps(result, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: construct-open-preparation
          path: |
            publication.json
            source/construct-open-focused.log
          retention-days: 7
          if-no-files-found: warn
