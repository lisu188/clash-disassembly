name: Fix recovered core pointer casts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply explicit 32-bit ABI casts
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          import sys

          root = Path.cwd()
          replacements = {
              "src/core/00401020_004011F0_core_001.c": {
                  "*(_DWORD *)&pathBuffer[44] = this;": "*(_DWORD *)&pathBuffer[44] = (_DWORD)(uintptr_t)this;",
              },
              "src/core/004015A0_00401A00_core_001.c": {
                  "holder[1] = &g_CompatStringHolder_Vtable;": "holder[1] = (_DWORD)(uintptr_t)&g_CompatStringHolder_Vtable;",
                  "*(_DWORD *)(holderBase + 4) = &g_PathEntry_Vtable;": "*(_DWORD *)(holderBase + 4) = (_DWORD)(uintptr_t)&g_PathEntry_Vtable;",
                  "result[1] = &g_CompatStringHolder_Vtable;": "result[1] = (_DWORD)(uintptr_t)&g_CompatStringHolder_Vtable;",
                  "result[1] = &g_PathEntry_Vtable;": "result[1] = (_DWORD)(uintptr_t)&g_PathEntry_Vtable;",
                  "return _wcpp_4_ctor_array__(this, 256);": "return _wcpp_4_ctor_array__((_DWORD)(uintptr_t)this, 256);",
                  "_wcpp_4_dtor_array_store__(array, &g_PathEntryArray_DtorDescriptor);": "_wcpp_4_dtor_array_store__((_DWORD)(uintptr_t)array, (_DWORD)(uintptr_t)&g_PathEntryArray_DtorDescriptor);",
                  "array[4] = g_PathEntryArray_Vtable;": "array[4] = (_DWORD)(uintptr_t)g_PathEntryArray_Vtable;",
                  "_wcpp_4_dtor_array_store__(array, &g_PathEntryArray_ElementDtorDescriptor);": "_wcpp_4_dtor_array_store__((_DWORD)(uintptr_t)array, (_DWORD)(uintptr_t)&g_PathEntryArray_ElementDtorDescriptor);",
                  "_wcpp_4_dtor_array_store__(*array, &g_PathEntryArray_ElementDtorDescriptor);": "_wcpp_4_dtor_array_store__(*array, (_DWORD)(uintptr_t)&g_PathEntryArray_ElementDtorDescriptor);",
                  "destEntry[3] = result;": "destEntry[3] = (_DWORD)(uintptr_t)result;",
                  "dest[2] = &g_CompatStringHolder_Vtable;": "dest[2] = (_DWORD)(uintptr_t)&g_CompatStringHolder_Vtable;",
                  "dest[2] = &g_PathEntry_Vtable;": "dest[2] = (_DWORD)(uintptr_t)&g_PathEntry_Vtable;",
                  "_wcpp_4_dtor_array_store__(entry, &g_PathEntry_DtorDescriptor);": "_wcpp_4_dtor_array_store__(entry, (_DWORD)(uintptr_t)&g_PathEntry_DtorDescriptor);",
              },
          }

          for relative, edits in replacements.items():
              path = root / relative
              text = path.read_text(encoding="utf-8")
              for old, new in edits.items():
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f"missing expected expression in {relative}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8", newline="\n")

          sys.path.insert(0, str(root / "tools"))
          from split_source_index import body_sha256, scan_definitions

          manifest_path = root / "data" / "recovered_sources.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          records = manifest["functions"]
          known_names = {record["name"] for record in records}
          records_by_source = {}
          for record in records:
              records_by_source.setdefault(record["source"], []).append(record)

          for relative in replacements:
              text = (root / relative).read_text(encoding="utf-8")
              definitions = {definition.name: definition for definition in scan_definitions(text, known_names)}
              for record in records_by_source[relative]:
                  definition = definitions.get(record["name"])
                  if definition is None:
                      raise SystemExit(f"missing definition for {record['name']} in {relative}")
                  record["body_sha256"] = body_sha256(text, definition)

          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8", newline="\n")
          (root / ".github" / "workflows" / "fix-clang-core-casts.yml").unlink()
          PY

          python3 tools/audit_split_sources.py
          python3 tools/migrate_pure_coverage_metadata.py --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Add explicit recovered core pointer casts"
          git push origin HEAD:${TARGET_BRANCH}
