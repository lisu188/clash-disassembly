name: Strategic insights validation
on:
  push:
    branches: [fix/strategic-ai-insights-20260905]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect strategic assembly evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('clash95.asm').read_text(errors='replace')
          for name in ('sub_459230', 'sub_4592E0'):
              match = re.search(r'^' + name + r'\s+proc\b.*?^' + name + r'\s+endp\b', text, re.M | re.S)
              assert match, name
              print(match[0])
          start = re.search(r'^loc_459107:', text, re.M)
          if start is None:
              start = re.search(r'^loc_459138:', text, re.M)
          end = re.search(r'^sub_4589C0\s+endp', text, re.M)
          assert start and end
          print(text[start.start():end.end()])
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if '__CHP' in line:
                  print('CHP SITE', '\n'.join(lines[max(0,i-2):i+4]))
                  break
          print('INDEX API')
          print(Path('tools/split_source_index.py').read_text()[:10000])
          PY
