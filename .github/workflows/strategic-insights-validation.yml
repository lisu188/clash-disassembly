name: Strategic insights validation
on:
  push:
    branches: [fix/strategic-ai-insights-20260905]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect strategic assembly text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('clash95.asm').read_bytes()
          print('prefix', repr(raw[:100]))
          encoding = 'utf-16' if 0 in raw[:50] else 'utf-8-sig'
          lines = raw.decode(encoding, errors='replace').splitlines()
          print('\n'.join(lines[:25]))
          positions = [i for i, line in enumerate(lines) if '459230' in line.lower() or '4589c0' in line.lower() or ('chp' in line.lower() and 'proc' in line.lower())]
          for index in positions[:12]:
              print('LOCATION', index+1)
              print('\n'.join(lines[max(0,index-3):index+250]))
          print('AUDIT IMPORTS')
          print('\n'.join(Path('tools/audit_split_sources.py').read_text().splitlines()[:65]))
          print('AUDIT INDEX')
          print('\n'.join(Path('tools/audit_split_sources.py').read_text().splitlines()[310:350]))
          PY
