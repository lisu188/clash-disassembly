name: Consolidate UnitStack readability

on:
  push:
    branches:
      - readability/unit-stack-record

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out readability branch
        uses: actions/checkout@v4
        with:
          ref: readability/unit-stack-record
          fetch-depth: 0

      - name: Consolidate on recovered UnitStackRecord
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/units/00414390_00416750_units_004.c")
          text = path.read_text(encoding="utf-8")
          old = '#include "unit_stack_record.h"\n/* CLASH95_UNIT_STACK_READABILITY_MIGRATED */\n'
          new = '''static inline UnitStackRecord *UnitStack_RecordAt(int stack_index)\n{\n  return (UnitStackRecord *)(uintptr_t)UNIT_STACK(stack_index);\n}\n'''
          if old not in text:
              raise SystemExit("typed UnitStack migration marker not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm src/units/unit_stack_record.h
          rm tools/migrate_unit_stack_readability.py

      - name: Validate canonical source contract
        run: |
          python3 tools/audit_split_sources.py
          git diff --check

      - name: Remove one-shot workflow
        run: rm .github/workflows/consolidate-unit-stack-readability.yml

      - name: Commit consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use canonical recovered UnitStackRecord"
          git push origin HEAD:readability/unit-stack-record
