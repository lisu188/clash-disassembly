name: Split clash95 source

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: split-clash95-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/split-clash95-src-v2
          fetch-depth: 0

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout 420 sudo -E apt-get update -o Acquire::Retries=3
          timeout 420 sudo -E apt-get install -y --no-install-recommends cmake ninja-build pkg-config libsdl2-dev libx11-dev

      - name: Split recovered source and verify exact partition
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re
          import shutil

          source_path = Path("clash95.c")
          source = source_path.read_text(encoding="utf-8")
          marker_re = re.compile(r"^//----- \(([0-9A-Fa-f]+)\) [-]+\s*$", re.MULTILINE)
          markers = list(marker_re.finditer(source))
          if not markers:
              raise SystemExit("No Hex-Rays function markers found")

          src_root = Path("src")
          if src_root.exists():
              shutil.rmtree(src_root)

          ranges = [
              (0x00401020, "src/core/010_bootstrap.inc.c", "Application bootstrap, shutdown, and initial game lifecycle"),
              (0x004015A0, "src/core/020_utilities.inc.c", "Recovered strings, memory, containers, paths, and shared utilities"),
              (0x00401A40, "src/render/030_render.inc.c", "Core surfaces, sprites, palettes, fonts, and rendering"),
              (0x00408000, "src/game/040_world_map.inc.c", "Strategic world map, minimap, camera, fog, roads, and map UI"),
              (0x0040F510, "src/game/050_units.inc.c", "Strategic units, stacks, movement, fatigue, morale, and path execution"),
              (0x0041D030, "src/game/060_buildings.inc.c", "Buildings, construction, economy, garrisons, and production"),
              (0x0042CB50, "src/game/070_battle.inc.c", "Tactical battle interaction, simulation, rendering, and outcomes"),
              (0x004338C0, "src/game/080_building_ui.inc.c", "Castle, garrison, production, and building modal interfaces"),
              (0x00441D90, "src/game/090_special_sites_savegame.inc.c", "Ports, temples, treasures, persistence, and related dialogs"),
              (0x00450000, "src/rules/100_strategic.inc.c", "Clash strategic rules integration, host functions, campaign, and AI"),
              (0x00461520, "src/runtime/110_platform_input.inc.c", "Recovered input, window, message, and platform-facing behavior"),
              (0x004637B0, "src/render/120_media.inc.c", "Recovered audio, music, AVI, and media support"),
              (0x00481550, "src/rules/130_clips_language.inc.c", "CLIPS lexer, parser, expressions, and procedural language support"),
              (0x00491580, "src/rules/140_clips_objects.inc.c", "CLIPS modules, classes, methods, and object metadata"),
              (0x004943E0, "src/rules/150_clips_ast.inc.c", "CLIPS AST construction, output, and compiler-front-end helpers"),
              (0x00496000, "src/rules/160_clips_events.inc.c", "CLIPS events, handlers, patterns, and runtime metadata"),
              (0x004A0000, "src/rules/170_clips_symbols.inc.c", "CLIPS symbols, lookup, evaluation, and shared rule-engine services"),
              (0x004ACB00, "src/rules/180_clips_compiler.inc.c", "CLIPS compiler marking, dependency, and emission passes"),
              (0x004C82D0, "src/rules/190_clips_methods.inc.c", "CLIPS method lookup, dispatch, and late object-runtime support"),
              (0x004D0000, "src/runtime/200_recovered_runtime.inc.c", "Recovered CRT, C++ support, streams, threading, and library runtime"),
          ]

          def classify(address):
              selected = ranges[0]
              for candidate in ranges:
                  if address >= candidate[0]:
                      selected = candidate
                  else:
                      break
              return selected

          prelude = source[:markers[0].start()]
          blocks = []
          for index, marker in enumerate(markers):
              end = markers[index + 1].start() if index + 1 < len(markers) else len(source)
              blocks.append((int(marker.group(1), 16), source[marker.start():end]))

          if prelude + "".join(block for _, block in blocks) != source:
              raise SystemExit("Source partition changed, omitted, or reordered bytes")

          prelude_path = Path("src/clash95_prelude.inc.c")
          prelude_path.parent.mkdir(parents=True, exist_ok=True)
          prelude_path.write_text(
              "/* Shared recovered declarations, types, macros, globals, and data.\n"
              " * Included by clash95.c; not a standalone translation unit. */\n\n" + prelude,
              encoding="utf-8",
          )

          segments = []
          for address, block in blocks:
              module = classify(address)
              if not segments or segments[-1]["module"][1] != module[1]:
                  segments.append({"module": module, "items": []})
              segments[-1]["items"].append((address, block))

          occurrences = defaultdict(int)
          includes = ["#include \"src/clash95_prelude.inc.c\""]
          module_rows = []
          emitted_source = prelude

          for segment in segments:
              _, base_path_text, description = segment["module"]
              items = segment["items"]
              occurrences[base_path_text] += 1
              part = occurrences[base_path_text]
              base_path = Path(base_path_text)
              if part == 1:
                  path = base_path
                  segment_description = description
              else:
                  path = base_path.with_name(base_path.name.replace(".inc.c", f"_part{part}.inc.c"))
                  segment_description = f"{description}, continued"

              path.parent.mkdir(parents=True, exist_ok=True)
              first_address = items[0][0]
              last_address = items[-1][0]
              body = "".join(block for _, block in items)
              emitted_source += body
              header = (
                  "/* " + segment_description + ".\n"
                  " * Original function-marker range: 0x%08X..0x%08X.\n"
                  " * Included by clash95.c; not a standalone translation unit. */\n\n"
                  % (first_address, last_address)
              )
              path.write_text(header + body, encoding="utf-8")
              includes.append(f"#include \"{path.as_posix()}\"")
              module_rows.append((path.as_posix(), first_address, last_address, len(items), segment_description))

          if emitted_source != source:
              raise SystemExit("Ordered module emission changed source byte order")

          source_path.write_text(
              "/* Recovered Win95 implementation.\n"
              " *\n"
              " * The source remains one translation unit to preserve recovered symbol\n"
              " * visibility, declaration order, static helpers, and direct test access.\n"
              " * Logical implementation fragments live under src/ and must not be\n"
              " * compiled independently. */\n\n" + "\n".join(includes) + "\n",
              encoding="utf-8",
          )

          readme = [
              "# Recovered source modules",
              "",
              "`clash95.c` is the only translation unit. It includes the fragments in this directory in original source order.",
              "",
              "The `.inc.c` files are not standalone sources. This first-stage split preserves shared globals, static helper visibility, declaration order, and the direct-include unit-test model.",
              "",
              "Repeated `_partN` fragments occur where recovered function-marker addresses are not monotonic in the decompiler output; keeping those parts separate prevents source reordering.",
              "",
              "| Fragment | Address range | Functions | Purpose |",
              "|---|---:|---:|---|",
          ]
          for path, first_address, last_address, count, description in module_rows:
              readme.append(f"| `{path}` | `0x{first_address:08X}..0x{last_address:08X}` | {count} | {description} |")
          readme.extend([
              "",
              "Future conversion to independent translation units requires explicit internal headers, `extern` ownership for globals, static-helper decisions, and a replacement for `tests/unit/test_all.c` directly including `clash95.c`.",
              "",
          ])
          Path("src/README.md").write_text("\n".join(readme), encoding="utf-8")
          PY

      - name: Build production targets
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target clash95_recovered clash95_bootstrap -j2

      - name: Build and run coverage unit tests
        run: |
          cmake -S . -B build-coverage -G Ninja -DCLASH95_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-coverage --target clash95_unit_tests -j2
          ctest --test-dir build-coverage -R '^clash95_unit_tests$' --output-on-failure

      - name: Commit validated split
        run: |
          rm .github/workflows/split-clash95-src.yml
          git diff --check
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Split clash95 recovered source into logical modules"
          git push origin HEAD:refactor/split-clash95-src-v2
