name: DOS Tooling

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dos-tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dos-integrity:
    name: DOS integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python tooling
        run: python3 -m py_compile tools/dos/*.py tests/dos/*.py

      - name: Run DOS tooling tests
        run: python3 -m unittest discover -s tests/dos -p 'test_*.py' -v

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool RECOVERED_STRUCTURES.json >/dev/null
          python3 -m json.tool UNIT_TYPES_AND_STATS.json >/dev/null
          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done < <(find tools/dos -maxdepth 1 -type f -name '*.json' -print0 | sort -z)

      - name: Verify generated DOS name maps
        id: verify-maps
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/dos/build_master_map.py --check; then
            exit 0
          fi
          python3 tools/dos/build_master_map.py
          git diff --no-ext-diff -- \
            tools/dos/dos_master_map.json \
            tools/dos/dos_name_conflicts.json \
            tools/dos/dos_dropped_false_anchors.json >dos-master-map.patch
          cat dos-master-map.patch
          exit 1

      - name: Upload generated-map diagnostics
        if: failure() && steps.verify-maps.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dos-master-map-diagnostics
          path: |
            dos-master-map.patch
            tools/dos/dos_master_map.json
            tools/dos/dos_name_conflicts.json
            tools/dos/dos_dropped_false_anchors.json
          if-no-files-found: error

      - name: Check Markdown links
        id: markdown-links
        shell: bash
        run: |
          set -o pipefail
          python3 tests/check_markdown_links.py 2>&1 | tee markdown-links.log

      - name: Upload Markdown-link diagnostics
        if: failure() && steps.markdown-links.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: markdown-link-diagnostics
          path: markdown-links.log
          if-no-files-found: error

      - name: Check whitespace errors
        run: git diff --check

  linux-build:
    name: Linux compile and link
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libsdl2-dev libx11-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build clash95_bootstrap
        run: cmake --build build --target clash95_bootstrap -j2
