name: Readability refresh

on:
  push:
    branches:
      - readability/unitstack-player-building
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readability/unitstack-player-building
          fetch-depth: 0
      - name: Regenerate narrowed headers and include blocks
        run: |
          python3 tools/gen_subsystem_headers.py --write
          python3 tools/gen_subsystem_headers.py --write-tu-includes strategic
          python3 tools/gen_subsystem_headers.py --check
          python3 tools/gen_subsystem_headers.py --check-tu-includes
      - name: Commit generated outputs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src data/subsystem_api.json
          git commit -m 'Regenerate subsystem headers after readability pass'
          git push origin HEAD:readability/unitstack-player-building
