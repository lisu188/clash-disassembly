name: Fix support function prototypes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Add explicit void parameter lists
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path.cwd()
          edits = {
              "src/compatibility/defs.h": {
                  "int CRT_FinalizeAnsiApiStringResult();": "int CRT_FinalizeAnsiApiStringResult(void);",
                  "int CRT_FinalizeWideApiStringResult();": "int CRT_FinalizeWideApiStringResult(void);",
                  "int rand_();": "int rand_(void);",
              },
              "src/platform/platform_sdl_runtime.c": {
                  "HWND __stdcall GetForegroundWindow()": "HWND __stdcall GetForegroundWindow(void)",
                  "DWORD __stdcall timeGetTime()": "DWORD __stdcall timeGetTime(void)",
                  "DWORD __stdcall GetTickCount()": "DWORD __stdcall GetTickCount(void)",
                  "DWORD __stdcall GetVersion()": "DWORD __stdcall GetVersion(void)",
                  "BOOL __stdcall WaitMessage()": "BOOL __stdcall WaitMessage(void)",
              },
          }
          for relative, replacements in edits.items():
              path = root / relative
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f"missing expected declaration in {relative}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8", newline="\n")
          (root / ".github" / "workflows" / "fix-support-prototypes.yml").unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Add explicit support function prototypes"
          git push origin HEAD:${TARGET_BRANCH}
