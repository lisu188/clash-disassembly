name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CLIPS runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clips

      - name: Compile Python tooling
        run: python3 -m py_compile tools/*.py

      - name: Validate strategic AI BSAVE contract
        run: python3 tools/check_clash_dat_bsave.py

      - name: Validate strategic AI compiled primitives
        run: python3 tools/check_clash_dat_primitives.py

      - name: Validate strategic AI defclass recovery
        run: python3 tools/check_clash_dat_classes.py

      - name: Validate strategic AI slot facet recovery
        run: python3 tools/check_clash_dat_slot_facets.py

      - name: Validate strategic AI message-handler recovery
        run: python3 tools/check_clash_dat_message_handlers.py

      - name: Validate strategic AI RETE topology
        run: python3 tools/check_clash_dat_rete.py

      - name: Validate strategic AI LHS recovery
        run: python3 tools/check_clash_dat_lhs.py

      - name: Validate unified recovered CLP program
        run: python3 tools/check_clash_recovered_clp.py

      - name: Load unified recovered CLP in CLIPS
        run: python3 tools/check_clash_recovered_clips_load.py

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool RECOVERED_STRUCTURES.json >/dev/null
          python3 -m json.tool UNIT_TYPES_AND_STATS.json >/dev/null
          python3 -m json.tool data/recovered_sources.json >/dev/null
          python3 -m json.tool data/recovered_warning_baseline.json >/dev/null
          python3 -m json.tool data/link_surface_baseline.json >/dev/null
          python3 -m json.tool data/recovered_decls.json >/dev/null
          python3 -m json.tool data/subsystem_api.json >/dev/null
          python3 -m json.tool data/header_surface_baseline.json >/dev/null
          python3 -m json.tool tests/unit/pure_function_aliases.json >/dev/null
          python3 -m json.tool tests/unit/pure_set.json >/dev/null

      - name: Audit split sources and frozen metadata
        run: |
          python3 tools/audit_split_sources.py
          python3 tools/migrate_pure_coverage_metadata.py --check
          python3 tools/check_save_format_contract.py
          python3 tools/gen_constant_guard.py --check

      - name: Audit header surface and coupling ratchet
        run: python3 tools/audit_header_surface.py --mode check

      - name: Check Markdown links
        id: markdown-links
        shell: bash
        run: |
          set -o pipefail
          python3 tests/check_markdown_links.py 2>&1 | tee markdown-links.log

      - name: Upload Markdown-link diagnostics
        if: failure() && steps.markdown-links.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: markdown-link-diagnostics
          path: markdown-links.log
          if-no-files-found: error

      - name: Check whitespace errors
        run: git diff --check

  linux-build:
    name: Linux ${{ matrix.compiler }} compile and link
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC 13
            cc: gcc-13
            package: gcc-13
            compiler_id: gcc
            warning_mode: check
          - compiler: Clang 18
            cc: clang-18
            package: clang-18
            compiler_id: clang
            warning_mode: check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libsdl2-dev libx11-dev ${{ matrix.package }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build split targets with asset-free tests
        id: build
        shell: bash
        run: |
          if ! cmake --build build --target clash95_recovered clash95_bootstrap runtime_mission_trace_tests clash95_split_audit -j2 >compiler.log 2>&1; then
            tail -n 200 compiler.log
            exit 1
          fi

      - name: Check recovered warning ratchet
        shell: bash
        run: python3 tools/check_recovered_warnings.py compiler.log --compiler ${{ matrix.compiler_id }} --mode ${{ matrix.warning_mode }}

      - name: Check linked symbol surface and data layout
        shell: bash
        run: |
          python3 tools/check_link_surface.py build/bin/clash95_bootstrap \
            --lib build/lib/libclash95_recovered.a \
            --compiler ${{ matrix.compiler_id }} --mode check

      - name: Run asset-free CTest gates
        run: ctest --test-dir build -R '^(clash95_split_source_audit|clash95_pure_metadata_audit|clash95_save_format_contract|runtime_mission_trace_tests)$' --output-on-failure

      - name: Upload compiler diagnostics
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: recovered-${{ matrix.cc }}-diagnostics
          path: compiler.log
          if-no-files-found: warn

  unit-coverage:
    name: Split unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libsdl2-dev libx11-dev

      - name: Configure coverage build
        run: cmake -S . -B build/coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCLASH95_COVERAGE=ON

      - name: Build independently compiled unit harness
        id: unit-build
        shell: bash
        run: |
          if ! cmake --build build/coverage --target clash95_unit_tests -j2 >unit-compiler.log 2>&1; then
            tail -n 200 unit-compiler.log
            exit 1
          fi

      - name: Upload unit harness compiler diagnostics
        if: always() && steps.unit-build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: split-unit-compiler-diagnostics
          path: unit-compiler.log
          if-no-files-found: warn

      - name: Run split unit suite
        run: ctest --test-dir build/coverage -R '^clash95_unit_tests$' --output-on-failure

      - name: Enforce frozen coverage floor
        run: python3 tools/measure_pure_coverage.py build/coverage --minimum 89.7 --require-functions 718 --require-zero-uncovered --worst 10

  refresh-maintenance-artifacts:
    name: Refresh recovered maintenance artifacts
    if: github.event_name == 'pull_request' && github.head_ref == 'readability/unit-stack-record'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: readability/unit-stack-record
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libsdl2-dev libx11-dev gcc-13 clang-18

      - name: Remove packed-overlay ABI cast warnings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/units/0040F510_00411560_units_001.c'): [
                  ('Rules_RetractArmyFact((_DWORD *)stack,', 'Rules_RetractArmyFact((_DWORD *)(void *)stack,', 1),
                  ('Rules_RetractArmyFact((_DWORD *)stackRecord,', 'Rules_RetractArmyFact((_DWORD *)(void *)stackRecord,', 1),
                  ('return (__int16 *)stack;', 'return (__int16 *)(void *)stack;', 2),
              ],
              Path('src/units/004115E0_00412BE0_units_002.c'): [
                  ('return (__int16 *)slot;', 'return (__int16 *)(void *)slot;', 2),
              ],
              Path('src/units/00414390_00416750_units_004.c'): [
                  ('UnitStack_GetTileMoveCostOrZero((__int16 *)stack,', 'UnitStack_GetTileMoveCostOrZero((__int16 *)(void *)stack,', 4),
                  ('UnitStack_GetTileMoveCostFromMergedProfileOrZero((__int16 *)stackRecord,', 'UnitStack_GetTileMoveCostFromMergedProfileOrZero((__int16 *)(void *)stackRecord,', 1),
              ],
          }
          total = 0
          for path, rules in replacements.items():
              text = path.read_text(encoding='latin-1')
              for old, new, expected in rules:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
                  text = text.replace(old, new)
                  total += count
              path.write_text(text, encoding='latin-1', newline='')
          if total != 11:
              raise SystemExit(f'expected 11 packed ABI cast fixes, applied {total}')
          print(f'applied {total} packed ABI cast fixes')
          PY

      - name: Regenerate header surface
        run: |
          python3 tools/gen_subsystem_headers.py --write
          python3 tools/gen_subsystem_headers.py --write-tu-includes clips
          python3 tools/gen_subsystem_headers.py --write-tu-includes media
          python3 tools/audit_header_surface.py --mode update
          python3 tools/audit_header_surface.py --mode check

      - name: Build reviewed GCC warning profile
        shell: bash
        run: |
          CC=gcc-13 cmake -S . -B build/maintenance-gcc -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/maintenance-gcc --target clash95_recovered clash95_bootstrap runtime_mission_trace_tests clash95_split_audit -j2 >gcc-maintenance.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          from tools.check_recovered_warnings import DEFAULT_SOURCE_PREFIXES, warning_counts
          counts, _ = warning_counts(Path('gcc-maintenance.log').read_text(errors='replace'), 'gcc', DEFAULT_SOURCE_PREFIXES)
          packed = counts.get('-Waddress-of-packed-member', 0)
          print(f'gcc packed-member warnings: {packed}; total={sum(counts.values())}')
          if packed > 2:
              raise SystemExit(f'packed-member warning regression remains: {packed} > 2')
          PY
          python3 tools/check_recovered_warnings.py gcc-maintenance.log --compiler gcc --mode update

      - name: Build reviewed Clang warning profile
        shell: bash
        run: |
          CC=clang-18 cmake -S . -B build/maintenance-clang -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/maintenance-clang --target clash95_recovered clash95_bootstrap runtime_mission_trace_tests clash95_split_audit -j2 >clang-maintenance.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          from tools.check_recovered_warnings import DEFAULT_SOURCE_PREFIXES, warning_counts
          counts, _ = warning_counts(Path('clang-maintenance.log').read_text(errors='replace'), 'clang', DEFAULT_SOURCE_PREFIXES)
          packed = counts.get('-Waddress-of-packed-member', 0)
          print(f'clang packed-member warnings: {packed}; total={sum(counts.values())}')
          if packed > 2:
              raise SystemExit(f'packed-member warning regression remains: {packed} > 2')
          PY
          python3 tools/check_recovered_warnings.py clang-maintenance.log --compiler clang --mode update

      - name: Verify refreshed ratchets
        run: |
          python3 tools/audit_split_sources.py
          python3 tools/audit_header_surface.py --mode check
          python3 tools/check_recovered_warnings.py gcc-maintenance.log --compiler gcc --mode check
          python3 tools/check_recovered_warnings.py clang-maintenance.log --compiler clang --mode check
          git diff --check

      - name: Commit reviewed maintenance state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src data
          if git diff --cached --quiet; then
            echo 'No maintenance changes to commit'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Refresh recovered CI maintenance baselines'
          git push origin HEAD:readability/unit-stack-record
