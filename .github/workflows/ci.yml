name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-relocation:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Repair relocated inventory
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path.cwd()
          audit = root / "tools" / "audit_split_sources.py"
          text = audit.read_text(encoding="utf-8")
          start = text.index("    generated = sorted(")
          end = text.index("    audit.require(bool(generated)", start)
          replacement = '''    generated = sorted(
              {
                  ROOT / value["source"]
                  for value in records
                  if isinstance(value, dict) and isinstance(value.get("source"), str)
              }
              | ({state_owner} if state_owner is not None else set())
          )
'''
          audit.write_text(text[:start] + replacement + text[end:], encoding="utf-8", newline="\n")

          for relative in (
              "src/recovered/runtime/00461520_platform_input.inc.c",
              "src/recovered/runtime/004D0560_legacy_runtime.inc.c",
              ".github/workflows/diagnose-relocation.yml",
              ".github/workflows/apply-relocation-fixes.yml",
          ):
              (root / relative).unlink(missing_ok=True)
          PY
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python3 tools/audit_split_sources.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix relocated source audit inventory"
          git push origin HEAD:${TARGET_BRANCH}

  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python tooling
        run: python3 -m py_compile tools/*.py

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool RECOVERED_STRUCTURES.json >/dev/null
          python3 -m json.tool UNIT_TYPES_AND_STATS.json >/dev/null
          python3 -m json.tool data/recovered_sources.json >/dev/null
          python3 -m json.tool data/recovered_warning_baseline.json >/dev/null
          python3 -m json.tool tests/unit/pure_function_aliases.json >/dev/null
          python3 -m json.tool tests/unit/pure_set.json >/dev/null

      - name: Audit split sources and frozen metadata
        run: |
          python3 tools/audit_split_sources.py
          python3 tools/migrate_pure_coverage_metadata.py --check
          python3 tools/check_save_format_contract.py

      - name: Check Markdown links
        id: markdown-links
        shell: bash
        run: |
          set -o pipefail
          python3 tests/check_markdown_links.py 2>&1 | tee markdown-links.log

      - name: Upload Markdown-link diagnostics
        if: failure() && steps.markdown-links.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: markdown-link-diagnostics
          path: markdown-links.log
          if-no-files-found: error

      - name: Check whitespace errors
        run: git diff --check

  linux-build:
    name: Linux ${{ matrix.compiler }} compile and link
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC 13
            cc: gcc-13
            package: gcc-13
            compiler_id: gcc
            warning_mode: check
          - compiler: Clang 18
            cc: clang-18
            package: clang-18
            compiler_id: clang
            warning_mode: report

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libsdl2-dev libx11-dev ${{ matrix.package }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build split targets with asset-free tests
        id: build
        shell: bash
        run: |
          if ! cmake --build build --target clash95_recovered clash95_bootstrap runtime_mission_trace_tests clash95_split_audit -j2 >compiler.log 2>&1; then
            tail -n 200 compiler.log
            exit 1
          fi

      - name: Check recovered warning ratchet
        shell: bash
        run: python3 tools/check_recovered_warnings.py compiler.log --compiler ${{ matrix.compiler_id }} --mode ${{ matrix.warning_mode }}

      - name: Run asset-free CTest gates
        run: ctest --test-dir build -R '^(clash95_split_source_audit|clash95_pure_metadata_audit|clash95_save_format_contract|runtime_mission_trace_tests)$' --output-on-failure

      - name: Upload compiler diagnostics
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: recovered-${{ matrix.cc }}-diagnostics
          path: compiler.log
          if-no-files-found: warn

  unit-coverage:
    name: Split unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libsdl2-dev libx11-dev

      - name: Configure coverage build
        run: cmake -S . -B build/coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCLASH95_COVERAGE=ON

      - name: Build independently compiled unit harness
        run: cmake --build build/coverage --target clash95_unit_tests -j2

      - name: Run split unit suite
        run: ctest --test-dir build/coverage -R '^clash95_unit_tests$' --output-on-failure

      - name: Enforce frozen coverage floor
        run: python3 tools/measure_pure_coverage.py build/coverage --minimum 89.7 --require-functions 718 --require-zero-uncovered --worst 10
