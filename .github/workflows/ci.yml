name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CLIPS runtime
        id: clips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clips

      - name: Compile Python tooling
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python3 -m py_compile tools/*.py

      - name: Validate strategic AI BSAVE contract
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python3 tools/check_clash_dat_bsave.py

      - name: Validate strategic AI compiled primitives
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python3 tools/check_clash_dat_primitives.py

      - name: Validate strategic AI defclass recovery
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python3 tools/check_clash_dat_classes.py

      - name: Validate strategic AI slot facet recovery
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python3 tools/check_clash_dat_slot_facets.py

      - name: Validate strategic AI message-handler recovery
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python3 tools/check_clash_dat_message_handlers.py

      - name: Validate strategic AI RETE topology
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python3 tools/check_clash_dat_rete.py

      - name: Validate strategic AI LHS recovery
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python3 tools/check_clash_dat_lhs.py

      - name: Inventory unresolved strategic AI matcher tests
        id: matcher-inventory
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: |
          python3 tools/check_clash_dat_unresolved.py --json clash_dat_unresolved_inventory.json
          python3 -m json.tool clash_dat_unresolved_inventory.json >/dev/null

      - name: Validate unified recovered CLP program
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python3 tools/check_clash_recovered_clp.py

      - name: Load unified recovered CLP in CLIPS
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' && steps.clips.outcome == 'success' }}
        run: python3 tools/check_clash_recovered_clips_load.py

      - name: Validate JSON files
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool RECOVERED_STRUCTURES.json >/dev/null
          python3 -m json.tool UNIT_TYPES_AND_STATS.json >/dev/null
          python3 -m json.tool data/recovered_sources.json >/dev/null
          python3 -m json.tool data/recovered_warning_baseline.json >/dev/null
          python3 -m json.tool data/link_surface_baseline.json >/dev/null
          python3 -m json.tool data/recovered_decls.json >/dev/null
          python3 -m json.tool data/subsystem_api.json >/dev/null
          python3 -m json.tool data/header_surface_baseline.json >/dev/null
          python3 -m json.tool tests/unit/pure_function_aliases.json >/dev/null
          python3 -m json.tool tests/unit/pure_set.json >/dev/null

      - name: Upload unresolved matcher inventory
        if: ${{ always() && steps.matcher-inventory.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: clash-dat-unresolved-matcher-inventory
          path: clash_dat_unresolved_inventory.json
          if-no-files-found: error

      - name: Audit split sources and frozen metadata
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: |
          python3 tools/audit_split_sources.py
          python3 tools/migrate_pure_coverage_metadata.py --check
          python3 tools/check_save_format_contract.py
          python3 tools/gen_constant_guard.py --check
          python3 tools/gen_recovered_structs.py --check
          python3 tools/gen_unit_type_runtime_metadata.py --check

      - name: Test declaration metadata and header boundaries
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python3 -m unittest discover -s tests/tools -p 'test_*.py'

      - name: Audit header surface and coupling ratchet
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python3 tools/audit_header_surface.py --mode check 2>&1 | tee header-surface.log

      - name: Upload header-surface diagnostics
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: header-surface-diagnostics
          path: header-surface.log
          if-no-files-found: warn

      - name: Check Markdown links
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        id: markdown-links
        shell: bash
        run: |
          set -o pipefail
          python3 tests/check_markdown_links.py 2>&1 | tee markdown-links.log

      - name: Upload Markdown-link diagnostics
        if: failure() && steps.markdown-links.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: markdown-link-diagnostics
          path: markdown-links.log
          if-no-files-found: error

      - name: Check whitespace errors
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: git diff --check

  linux-build:
    name: Linux ${{ matrix.compiler }} compile and link
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC 13
            cxx: g++-13
            package: g++-13
            compiler_id: gcc
            warning_mode: check
          - compiler: Clang 18
            cxx: clang++-18
            package: clang-18
            compiler_id: clang
            warning_mode: check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        id: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libsdl2-dev libx11-dev ${{ matrix.package }}

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build split targets with asset-free tests
        id: build
        shell: bash
        run: |
          if ! cmake --build build --target clash95_recovered clash95_bootstrap runtime_mission_trace_tests clash95_split_audit -j2 >compiler.log 2>&1; then
            tail -n 200 compiler.log
            exit 1
          fi

      - name: Check recovered warning ratchet
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_recovered_warnings.py compiler.log --compiler ${{ matrix.compiler_id }} --mode ${{ matrix.warning_mode }} 2>&1 | tee warning-ratchet.log

      - name: Check linked symbol surface and data layout
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_link_surface.py build/bin/clash95_bootstrap \
            --lib build/lib/libclash95_recovered.a \
            --compiler ${{ matrix.compiler_id }} --mode check 2>&1 | tee link-surface.log

      - name: Run asset-free CTest gates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -R '^(clash95_split_source_audit|clash95_pure_metadata_audit|clash95_save_format_contract|runtime_mission_trace_tests)$' --output-on-failure --no-tests=error 2>&1 | tee asset-free-ctest.log

      - name: Test unit runner failure policy
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          CLASH95_RUNNER_TEST_CXX: ${{ matrix.cxx }}
        run: python3 -m unittest discover -s tests/tools -p 'test_unit_runner.py' -v

      - name: Upload compiler diagnostics
        if: ${{ always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: recovered-${{ matrix.cxx }}-diagnostics
          path: |
            compiler.log
            warning-ratchet.log
            link-surface.log
            asset-free-ctest.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  unit-coverage:
    name: Split unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libsdl2-dev libx11-dev g++-13

      - name: Configure coverage build
        env:
          CXX: g++-13
        run: cmake -S . -B build/coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCLASH95_COVERAGE=ON

      - name: Build independently compiled unit harness
        id: unit-build
        shell: bash
        run: |
          if ! cmake --build build/coverage --target clash95_unit_tests -j2 >unit-compiler.log 2>&1; then
            tail -n 200 unit-compiler.log
            exit 1
          fi

      - name: Upload unit harness compiler diagnostics
        if: always() && steps.unit-build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: split-unit-compiler-diagnostics
          path: unit-compiler.log
          if-no-files-found: warn

      - name: Run split unit suite
        run: ctest --test-dir build/coverage -R '^clash95_unit_tests$' --output-on-failure

      - name: Enforce frozen coverage floor
        run: python3 tools/measure_pure_coverage.py build/coverage --minimum 89.7 --require-functions 718 --require-zero-uncovered --worst 10
