name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python tooling
        run: python3 -m py_compile tools/*.py

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool RECOVERED_STRUCTURES.json >/dev/null
          python3 -m json.tool UNIT_TYPES_AND_STATS.json >/dev/null

      - name: Check Markdown links
        id: markdown-links
        shell: bash
        run: |
          set -o pipefail
          python3 tests/check_markdown_links.py 2>&1 | tee markdown-links.log

      - name: Upload Markdown-link diagnostics
        if: failure() && steps.markdown-links.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: markdown-link-diagnostics
          path: markdown-links.log
          if-no-files-found: error

      - name: Check whitespace errors
        run: git diff --check

  linux-build:
    name: Linux compile and link
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libsdl2-dev libx11-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build clash95_bootstrap and mission trace tests
        run: cmake --build build --target clash95_bootstrap runtime_mission_trace_tests -j2

      - name: Run mission trace unit test
        run: ctest --test-dir build -R '^runtime_mission_trace_tests$' --output-on-failure
