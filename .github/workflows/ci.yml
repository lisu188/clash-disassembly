name: WorldMap visibility preparation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visibility-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preparation:
    name: Visibility preparation (${{ matrix.id }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gcc13
            compiler: g++-13
            package: g++-13
          - id: clang18
            compiler: clang++-18
            package: clang-18
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PACKET: tools/visibility_class_preparation
    steps:
      - name: Check out exact diagnostic branch and reference history
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install required compiler
        id: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ ${{ matrix.package }}
          command -v ${{ matrix.compiler }}
          command -v g++

      - name: Record source and compiler identity
        id: identity
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: |
          PREPARATION="$RUNNER_TEMP/visibility-preparation"
          EVIDENCE="$RUNNER_TEMP/visibility-evidence"
          echo "PREPARATION=$PREPARATION" >> "$GITHUB_ENV"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/checkout.txt"
          git rev-parse HEAD^{tree} > "$EVIDENCE/tree.txt"
          ${{ matrix.compiler }} --version > "$EVIDENCE/compiler-version.txt"
          python3 --version > "$EVIDENCE/python-version.txt"
          df -h > "$EVIDENCE/filesystems.txt"

      - name: Materialize and verify pinned source stages
        id: materialize
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 "$PACKET/materialize.py" --repo "$GITHUB_WORKSPACE" --output "$PREPARATION" 2>&1 | tee "$EVIDENCE/materialize.log"

      - name: Reproduce extraction and relocation recipes
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 "$PACKET/verify_recipe.py" --work-root "$PREPARATION" --output "$EVIDENCE/recipe" 2>&1 | tee "$EVIDENCE/recipe.log"

      - name: Validate extracted methods and compatibility adapters
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 "$PREPARATION/extraction/tests/tools/fixtures/class_world_visibility/verify_world_visibility.py" \
            --root "$PREPARATION/extraction" --output "$EVIDENCE/extraction" \
            --kind all --compiler "${{ matrix.compiler }}" \
            --optimization O0 --optimization O2 --char-mode signed --char-mode unsigned \
            2>&1 | tee "$EVIDENCE/extraction.log"
          python3 "$PACKET/assert_profiles.py" --summary "$EVIDENCE/extraction/summary.json" --compiler "${{ matrix.compiler }}"

      - name: Validate relocated class methods and compatibility adapters
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 "$PREPARATION/relocation/tests/tools/fixtures/class_world_visibility/verify_world_visibility.py" \
            --root "$PREPARATION/relocation" --output "$EVIDENCE/relocation" \
            --kind all --compiler "${{ matrix.compiler }}" \
            --optimization O0 --optimization O2 --char-mode signed --char-mode unsigned \
            2>&1 | tee "$EVIDENCE/relocation.log"
          python3 "$PACKET/assert_profiles.py" --summary "$EVIDENCE/relocation/summary.json" --compiler "${{ matrix.compiler }}"

      - name: Exercise public visibility unittest entry points
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 "$PACKET/run_public_entrypoints.py" --root "$PREPARATION/relocation" \
            --compiler "${{ matrix.compiler }}" --output "$EVIDENCE/public-entrypoints.json" \
            2>&1 | tee "$EVIDENCE/public-entrypoints.log"

      - name: Verify extracted metadata and focused class tooling
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 "$PACKET/validate_tooling.py" --root "$PREPARATION/extraction" \
            --output "$EVIDENCE/extraction-tooling" --compiler "${{ matrix.compiler }}" --metadata-only \
            2>&1 | tee "$EVIDENCE/extraction-tooling.log"

      - name: Verify relocated metadata and focused class tooling
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 "$PACKET/validate_tooling.py" --root "$PREPARATION/relocation" \
            --output "$EVIDENCE/relocation-tooling" --compiler "${{ matrix.compiler }}" --metadata-only \
            2>&1 | tee "$EVIDENCE/relocation-tooling.log"

      - name: Retain preparation evidence including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: visibility-preparation-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/visibility-evidence/
            ${{ runner.temp }}/visibility-preparation/*.json
            ${{ runner.temp }}/visibility-preparation/metadata-logs/
          if-no-files-found: error
          retention-days: 30
