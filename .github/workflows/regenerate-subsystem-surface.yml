name: Regenerate subsystem surface

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'readability/unit-stack-record'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate narrowed headers and TU include blocks
        run: |
          python3 tools/gen_subsystem_headers.py --write
          python3 tools/gen_subsystem_headers.py --write-tu-includes clips
          python3 tools/gen_subsystem_headers.py --write-tu-includes media
          python3 tools/audit_header_surface.py --mode check
      - name: Commit generated surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src data/subsystem_api.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Regenerate subsystem header surface'
          git push origin HEAD:${{ github.head_ref }}
