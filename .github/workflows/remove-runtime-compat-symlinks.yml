name: Remove runtime compatibility symlinks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove obsolete compatibility symlinks
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm -f -- \
            src/runtime/110_platform_input.inc.c \
            src/runtime/200_recovered_runtime.inc.c
          rm -f \
            .github/workflows/inspect-merge-audit.yml \
            .github/workflows/remove-runtime-compat-symlinks.yml
          python3 tools/audit_split_sources.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Remove obsolete runtime compatibility symlinks"
          git push origin HEAD:${TARGET_BRANCH}
