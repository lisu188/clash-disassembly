name: Configure recovered Clang pointer warnings

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  configure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Preserve pointer diagnostics as warnings
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path.cwd()
          path = root / "CMakeLists.txt"
          text = path.read_text(encoding="utf-8")
          old = 'target_compile_options(${target} PRIVATE -Wno-error=int-conversion)'
          new = '''target_compile_options(${target} PRIVATE
                -Wno-error=int-conversion
                -Wno-error=incompatible-pointer-types
                -Wno-error=incompatible-function-pointer-types
              )'''
          if old not in text:
              raise SystemExit("Clang recovered warning block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          (root / ".github" / "workflows" / "configure-clang-pointer-warnings.yml").unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Report recovered Clang pointer diagnostics as warnings"
          git push origin HEAD:${TARGET_BRANCH}
